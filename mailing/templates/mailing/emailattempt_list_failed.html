{% extends 'mailing/base.html' %}

{% block title %} статистика {% endblock %}

{% block content %}
    <div class="row">
    </div>
        <div class="row text-center">
            <div class="col-12 mt-1">
                 <h4 class="mb-4 text-center mt-1"><img src="https://cdn-icons-png.flaticon.com/128/684/684831.png" class="mx-1" style="width: auto; height: 28px;"><a href="{% url 'mailing:emailattempt_list' %}" class="link-body-emphasis link-offset-2 link-underline link-underline-opacity-0">Отчеты</a></h4>
            </div>
            {% if emailattempts %}
            <div class="col-12 mt-1">
                <h5 class="mb-4 text-center mt-1">Всего: {{ count_failed }}</h5>
            </div>
            <div class="row">
                <div class="col-12">
                    <div class="row">
                        {% for emailattempt in emailattempts %}

                        <div class="col-4 mt-3 text-center">
                            <h4 class="mt-4 text-start"></h4>
                            <p class="text-start">
                                <button class="rounded text-start w-100 btn btn-outline-light border border-secondary-subtle">
                                    <a  class="link-body-emphasis link-offset-2 link-underline link-underline-opacity-0" href="{% url 'mailing:emailattempt_detail' emailattempt.pk %}">
                                        <h6 class=" mt-2 text-success-emphasis">
                                            Тема письма: <p class="p-3 text-black-50 bg-white mt-1">{{ emailattempt.campaign.message.subject }}</p>
                                            Получатель: <p class="p-3 text-black-50 bg-white mt-1">{{ emailattempt.subscriber }}</p></h6>
                                        <h6>{% if emailattempt.status == 'successful' %}
                                            Статус: <p class="p-3  bg-white mt-1 text-success">{{ emailattempt.status }}</p>
                                            {% else %}
                                            Статус: <p class="p-3 bg-white mt-1 text-danger">{{ emailattempt.status }}</p>
                                            {% endif %}</h6>
                                        <h6>Ответ почтового сервера: <p class="p-3 text-black-50 bg-white mt-1">{{ emailattempt.response }}</p>
                                            Дата отправки: <p class="p-3 text-black-50 bg-white rounded mt-1">{{ emailattempt.sent_at|date:"d/m/Y" }}</p></h6>
                                    </a>
                                </button>
                            </p>
                        </div>

                        {% endfor %}
                    </div>
                </div>
            </div>
            {% else %}
                    <div class="col-12">
                        <h4 class="text-center">Нет рассылок со статусом 'failed' </h4>
            {% endif %}





{% endblock %}
