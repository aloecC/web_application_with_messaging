{% extends 'mailing/base.html' %}

{% block title %} Рассылки {% endblock %}

{% block content %}
    <div class="row">
        <div class="col-12">
        <a href="{% url 'mailing:campaign_create' %}" class="mt-4 rounded text-center w-100 btn btn-outline-success border border-secondary-subtle">Создать новую рассылку</a>
        </div>
    </div>
    {% if campaignes %}
        <div class="row  text-center">
            <div class="col-12 mt-1">
                 <h4 class="mb-4 text-center mt-5">Список всех рассылок | {{ count }}</h4>
            </div>
            {% for campaign in campaignes %}
                <div class="col-12">
                    <h4 class="mt-4 text-start"></h4>
                    <p class="text-start">
                        <button class="rounded text-start w-50 btn btn-outline-light border border-secondary-subtle">
                            <a  class="link-body-emphasis link-offset-2 link-underline link-underline-opacity-0" href="{% url 'mailing:campaign_detail' campaign.pk %}">
                                <h6 class=" mt-2 text-success-emphasis">Тема письма:</h6>{{ campaign.message }} <h6 class=" mt-2 text-success-emphasis"></h6>
                                <h6 class=" mt-2 text-success-emphasis">{{ campaign.status }}</h6>
                                <h6 class=" mt-2 text-success-emphasis">{{ campaign.start_time }}||{{ campaign.end_time }}</h6></a></button> </p>
                        </div>
                <div class="col-2">
                </div>
            {% endfor %}
    {% endif %}
{% endblock %}
